name: MediaLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MediaLab:
    type: application
    platform: iOS
    sources:
      - path: MediaLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaLab
        PRODUCT_NAME: MediaLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MediaLab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - MediaLabTests
  MediaLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MediaLabTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaLabTests
        GENERATE_INFOPLIST_FILE: YES
